# ==========================================
# Render.com Blueprint (render.yaml)
# Khosamphi Hospital Analytics Dashboard
# ==========================================

services:
  - type: web
    name: khosamphi-hospital-analytics
    env: docker
    region: singapore # Closest region to Thailand for low latency
    plan: free # or starter
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: "Khosamphi Hospital Analytics"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_DATABASE
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-1-ap-southeast-2.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.sowuidgmhsmsfkakxnct
      - key: DB_PASSWORD
        sync: false # Set your Supabase database password in Render Dashboard
      - key: DB_SSLMODE
        value: require
      - key: HOSPITAL_NAME_TH
        value: "โรงพยาบาลโกสัมพีนคร"
      - key: HOSPITAL_NAME_EN
        value: "Khosamphi Nakhon Hospital"
      - key: HOSPITAL_PROVINCE
        value: "กำแพงเพชร"
      - key: HOSPITAL_BED_CAPACITY
        value: "30"
